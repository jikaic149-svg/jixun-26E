# Custom OpenOCD 2026-06-15 uses the current upstream TI script layout.
# Its MSPM0Gx519 FACTORYREGION fallback is used only for MSPM0G3519 +
# DAPLink. tools/mspm0.ps1 and Cortex-Debug's Doctor prelaunch both verify
# this config and the custom OpenOCD runtime before target access.
source [find interface/cmsis-dap.cfg]
# Cortex-Debug and tools/mspm0.ps1 both run OpenOCD from the workspace root.
source [file normalize [file join [pwd] .. "TI ENV" local openocd daplink.cfg]]
transport select swd
adapter speed 2000
source [find target/ti/mspm0.cfg]
